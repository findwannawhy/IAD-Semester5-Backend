definitions:
  ds.AcidSolubleSample:
    properties:
      deleted:
        type: boolean
      description:
        type: string
      formula:
        type: string
      id:
        type: integer
      image_url:
        type: string
      relative_molecular_mass:
        type: number
      stoichiometric_coefficient:
        type: number
      title:
        type: string
    type: object
  ds.ExperimentSample:
    properties:
      acid_soluble_sample:
        $ref: '#/definitions/ds.AcidSolubleSample'
      evolved_gas_volume:
        type: number
      experiment_id:
        type: integer
      impurity_fraction_experiment:
        $ref: '#/definitions/ds.ImpurityFractionExperiment'
      mass_fraction_percentage:
        type: number
      sample_id:
        type: integer
      sample_mass:
        type: number
    type: object
  ds.ImpurityFractionExperiment:
    properties:
      created_at:
        type: string
      creator:
        $ref: '#/definitions/ds.User'
      creator_id:
        type: string
      finished_at:
        type: string
      formed_at:
        type: string
      id:
        type: integer
      moderator:
        $ref: '#/definitions/ds.User'
      moderator_id:
        type: string
      molar_volume:
        type: number
      status:
        type: string
    type: object
  ds.User:
    properties:
      id:
        type: string
      is_moderator:
        type: boolean
      login:
        type: string
      password:
        type: string
    type: object
  dto.DraftExperimentResponse:
    properties:
      experiment_id:
        type: integer
      sample_count:
        type: integer
    type: object
  dto.ExperimentResponse:
    properties:
      creator_login:
        type: string
      experiment:
        $ref: '#/definitions/ds.ImpurityFractionExperiment'
      experiment_sample_cards:
        items:
          $ref: '#/definitions/dto.ExperimentSampleCard'
        type: array
      moderator_login:
        type: string
    type: object
  dto.ExperimentSampleCard:
    properties:
      evolvedGasVolume:
        type: string
      formula:
        type: string
      imageURL:
        type: string
      massFractionPercentage:
        type: string
      relativeMolecularMass:
        format: float64
        type: number
      sampleID:
        type: integer
      sampleMass:
        type: string
      stoichiometricCoefficient:
        format: float64
        type: number
      title:
        type: string
    type: object
  dto.ExperimentsResponse:
    properties:
      created_at:
        type: string
      creator_login:
        type: string
      finished_at:
        type: string
      formed_at:
        type: string
      id:
        type: integer
      moderator_login:
        type: string
      molar_volume:
        type: number
      status:
        type: string
    type: object
  dto.FormExperiment:
    properties:
      creator_login:
        type: string
      experiment:
        $ref: '#/definitions/ds.ImpurityFractionExperiment'
    type: object
  dto.ModerateExperiment:
    properties:
      creator_login:
        type: string
      experiment:
        $ref: '#/definitions/ds.ImpurityFractionExperiment'
      moderator_login:
        type: string
    type: object
  dto.SoftDeleteExperiment:
    properties:
      creator_login:
        type: string
      deleted_at:
        type: string
      id:
        type: integer
      status:
        type: string
    type: object
  dto.StatusJSON:
    properties:
      status:
        type: string
    type: object
  dto.UpdateExperiment:
    properties:
      creator_login:
        type: string
      experiment:
        $ref: '#/definitions/ds.ImpurityFractionExperiment'
    type: object
  dto.UpdateExperimentSampleReq:
    properties:
      evolved_gas_volume:
        type: number
      sample_mass:
        type: number
    type: object
  dto.UserResponse:
    properties:
      id:
        type: string
      is_moderator:
        type: boolean
      login:
        type: string
    type: object
info:
  contact: {}
paths:
  /impurity-experiments:
    get:
      description: Возвращает исследования с возможностью фильтрации по датам и статусу
      parameters:
      - description: Начальная дата (YYYY-MM-DD)
        in: query
        name: from-date
        type: string
      - description: Конечная дата (YYYY-MM-DD)
        in: query
        name: to-date
        type: string
      - description: Статус исследования
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Список исследований
          schema:
            items:
              $ref: '#/definitions/dto.ExperimentsResponse'
            type: array
        "400":
          description: Неверный формат даты
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Получить список исследований
      tags:
      - impurity-experiments
  /impurity-experiments/{id}:
    delete:
      description: Выполняет логическое удаление исследования
      parameters:
      - description: ID исследования
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Статус удаления
          schema:
            $ref: '#/definitions/dto.SoftDeleteExperiment'
        "400":
          description: Неверный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Исследование не найдено
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Удалить исследование
      tags:
      - impurity-experiments
    get:
      description: Возвращает полную информацию об исследовании включая образцы
      parameters:
      - description: ID исследования
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Данные исследования с образцами
          schema:
            $ref: '#/definitions/dto.ExperimentResponse'
        "400":
          description: Неверный ID
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Исследование не найдено
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Получить исследование по ID
      tags:
      - impurity-experiments
    put:
      consumes:
      - application/json
      description: Обновляет данные исследования
      parameters:
      - description: ID исследования
        in: path
        name: id
        required: true
        type: integer
      - description: Новые данные исследования
        in: body
        name: experiment
        required: true
        schema:
          $ref: '#/definitions/ds.ImpurityFractionExperiment'
      produces:
      - application/json
      responses:
        "200":
          description: Обновленное исследование
          schema:
            $ref: '#/definitions/dto.UpdateExperiment'
        "400":
          description: Неверные данные
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Исследование не найдено
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Изменить исследование
      tags:
      - impurity-experiments
  /impurity-experiments/{id}/form:
    put:
      description: Переводит исследование в статус "formed"
      parameters:
      - description: ID исследования
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Сформированное исследование
          schema:
            $ref: '#/definitions/dto.FormExperiment'
        "400":
          description: Неверный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Исследование не найдено
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Сформировать исследование
      tags:
      - impurity-experiments
  /impurity-experiments/{id}/moderation:
    put:
      consumes:
      - application/json
      description: Изменяет статус исследования (только для модераторов)
      parameters:
      - description: ID исследования
        in: path
        name: id
        required: true
        type: integer
      - description: Новый статус
        in: body
        name: status
        required: true
        schema:
          $ref: '#/definitions/dto.StatusJSON'
      produces:
      - application/json
      responses:
        "200":
          description: Результат модерации
          schema:
            $ref: '#/definitions/dto.ModerateExperiment'
        "400":
          description: Неверный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Исследование не найдено
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Модерировать исследование
      tags:
      - impurity-experiments
  /impurity-experiments/{id}/soluble-samples/{sample_id}:
    delete:
      description: Удаляет связь образца и исследования
      parameters:
      - description: ID исследования
        in: path
        name: id
        required: true
        type: integer
      - description: ID образца
        in: path
        name: sample_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Обновленное исследование
          schema:
            $ref: '#/definitions/dto.ExperimentResponse'
        "400":
          description: Неверные ID
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Не найдено
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Удалить образец из исследования
      tags:
      - experiments-samples
    put:
      consumes:
      - application/json
      description: Обновляет параметры образца в конкретном исследовании
      parameters:
      - description: ID исследования
        in: path
        name: id
        required: true
        type: integer
      - description: ID образца
        in: path
        name: sample_id
        required: true
        type: integer
      - description: Новые данные
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateExperimentSampleReq'
      produces:
      - application/json
      responses:
        "200":
          description: Обновленные данные
          schema:
            $ref: '#/definitions/ds.ExperimentSample'
        "400":
          description: Неверные данные
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Не найдено
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Изменить данные образца в исследовании
      tags:
      - experiments-samples
  /impurity-experiments/draft:
    get:
      description: Возвращает информацию о текущем черновике исследования пользователя
      produces:
      - application/json
      responses:
        "200":
          description: Данные черновика исследования
          schema:
            $ref: '#/definitions/dto.DraftExperimentResponse'
        "400":
          description: Неверный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Получить черновик исследования
      tags:
      - impurity-experiments
  /soluble-samples:
    get:
      description: Возвращает все образцы или фильтрует по названию
      parameters:
      - description: Название образца для поиска
        in: query
        name: search_sample
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Список образцов
          schema:
            items:
              $ref: '#/definitions/ds.AcidSolubleSample'
            type: array
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить список образцов
      tags:
      - soluble-samples
    post:
      consumes:
      - application/json
      description: Создает новый образец и возвращает его данные
      parameters:
      - description: Данные нового образца
        in: body
        name: sample
        required: true
        schema:
          $ref: '#/definitions/ds.AcidSolubleSample'
      produces:
      - application/json
      responses:
        "201":
          description: Созданный образец
          schema:
            $ref: '#/definitions/ds.AcidSolubleSample'
        "400":
          description: Неверные данные
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Создать новый образец
      tags:
      - soluble-samples
  /soluble-samples/{id}:
    delete:
      description: Выполняет логическое удаление образца по ID
      parameters:
      - description: ID образца
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Статус удаления
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Неверный ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Образец не найден
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Удалить образец
      tags:
      - soluble-samples
    get:
      description: Возвращает информацию о образце по её идентификатору
      parameters:
      - description: ID образца
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Данные образца
          schema:
            $ref: '#/definitions/ds.AcidSolubleSample'
        "400":
          description: Неверный ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Образец не найден
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить образец по ID
      tags:
      - soluble-samples
    put:
      consumes:
      - application/json
      description: Обновляет информацию о образце по ID
      parameters:
      - description: ID образца
        in: path
        name: id
        required: true
        type: integer
      - description: Новые данные образца
        in: body
        name: sample
        required: true
        schema:
          $ref: '#/definitions/ds.AcidSolubleSample'
      produces:
      - application/json
      responses:
        "200":
          description: Обновленный образец
          schema:
            $ref: '#/definitions/ds.AcidSolubleSample'
        "400":
          description: Неверные данные
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Образец не найден
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Изменить данные образца
      tags:
      - soluble-samples
  /soluble-samples/{id}/experiments/draft:
    post:
      description: Добавляет образец в черновик исследования пользователя
      parameters:
      - description: ID образца
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Исследование с добавленным образцом
          schema:
            $ref: '#/definitions/dto.ExperimentResponse'
        "201":
          description: Создано новое исследование
          schema:
            $ref: '#/definitions/dto.ExperimentResponse'
        "400":
          description: Неверный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Образец не найден
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Образец уже в исследовании
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Добавить образец в черновик исследования
      tags:
      - soluble-samples
  /soluble-samples/{id}/image:
    post:
      consumes:
      - multipart/form-data
      description: Загружает изображение для образца и возвращает обновленные данные
      parameters:
      - description: ID образца
        in: path
        name: id
        required: true
        type: integer
      - description: Изображение образца
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Статус загрузки и данные образца
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Неверный запрос или файл
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Образец не найден
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Загрузить изображение для образца
      tags:
      - soluble-samples
  /users/{login}/profile:
    get:
      description: Возвращает данные профиля (доступен только тот, чей UUID совпадает
        с user_id в токене).
      parameters:
      - description: Логин пользователя
        in: path
        name: login
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Профиль пользователя
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Проблема с авторизацией/получением user_id"}
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Пользователи не совпадают
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Пользователь не найден
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Получить профиль пользователя
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Обновляет профиль пользователя (может делать только сам пользователь).
      parameters:
      - description: Логин пользователя
        in: path
        name: login
        required: true
        type: string
      - description: Новые данные профиля
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/ds.User'
      produces:
      - application/json
      responses:
        "200":
          description: Обновлённый профиль
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Ошибка запроса или авторизации
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещён
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Пользователь не найден
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Изменить профиль пользователя
      tags:
      - users
  /users/sign-in:
    post:
      consumes:
      - application/json
      description: Принимает логин/пароль, возвращает jwt-токен в формате {"token":"..."}.
      parameters:
      - description: Логин и пароль
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/ds.User'
      produces:
      - application/json
      responses:
        "200":
          description: token
          schema:
            additionalProperties:
